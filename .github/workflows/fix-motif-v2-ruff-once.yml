# SPDX-License-Identifier: Apache-2.0
name: Fix motif v2 Ruff debt once

on:
  push:
    branches:
      - fix/class-motif-bundle-contract
    paths:
      - .github/workflows/fix-motif-v2-ruff-once.yml

permissions:
  contents: write

concurrency:
  group: fix-motif-v2-ruff-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/class-motif-bundle-contract
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install from the clean provenance checkout
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Apply the exact Ruff formatter output
        shell: bash
        run: |
          set -euo pipefail
          ruff check src/szl_brand/motif.py
          ruff format src/szl_brand/motif.py
          git diff --check

      - name: Prove the complete motif bundle contract
        run: |
          set -euo pipefail
          python -m pytest tests -q
          ruff check src tests hatch_build.py
          ruff format --check src tests hatch_build.py
          git diff --check

      - name: Commit the durable format and remove this controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add src/szl_brand/motif.py
          git rm .github/workflows/fix-motif-v2-ruff-once.yml
          git diff --cached --quiet && { echo "no motif format correction"; exit 1; }
          git commit -s -m "fix(brand): finalize the Ruff-clean motif v2 bundle"
          git push origin HEAD:fix/class-motif-bundle-contract
