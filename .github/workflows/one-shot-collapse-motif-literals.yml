# SPDX-License-Identifier: Apache-2.0
name: One-shot explicit motif literals

on:
  push:
    branches:
      - feat/class-motif-compiler-v1
    paths:
      - .github/workflows/one-shot-collapse-motif-literals.yml

permissions:
  contents: write

concurrency:
  group: one-shot-explicit-motif-literals
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: feat/class-motif-compiler-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Collapse the four reviewed implicit literal pairs
        env:
          BRANCH: feat/class-motif-compiler-v1
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/szl_brand/motif.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          markers = {
              "DECISION / MAP / EVIDENCE",
              "EVIDENCE RAIL",
              "TOPOLOGY",
              "HISTORICAL ARTIFACT · NO LIVE RUNTIME CLAIM",
          }
          found: set[str] = set()
          output: list[str] = []
          index = 0
          while index < len(lines):
              if index + 1 < len(lines):
                  first = lines[index]
                  second = lines[index + 1]
                  marker = next((value for value in markers if value in second), None)
                  if (
                      marker is not None
                      and first.endswith("'")
                      and second.lstrip().startswith("'font-size=")
                  ):
                      output.append(first[:-1] + second.lstrip()[1:])
                      found.add(marker)
                      index += 2
                      continue
              output.append(lines[index])
              index += 1

          missing = markers - found
          if missing or len(found) != 4:
              raise SystemExit(f"reviewed literal repair incomplete; found={sorted(found)!r} missing={sorted(missing)!r}")
          path.write_text("\n".join(output) + "\n", encoding="utf-8", newline="\n")
          PY
          python -m pip install --disable-pip-version-check --no-cache-dir "ruff==0.16.6"
          ruff check src tests hatch_build.py
          ruff format --check src tests hatch_build.py
          git config user.name "szl-frontier-bot"
          git config user.email "stephenlutar2+frontier@gmail.com"
          git add src/szl_brand/motif.py
          git commit -m "fix(brand): remove implicit motif literal concatenation" -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin "HEAD:${BRANCH}"
