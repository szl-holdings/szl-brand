# SPDX-License-Identifier: Apache-2.0
name: One-shot motif formatter

on:
  push:
    branches:
      - feat/class-motif-compiler-v1
    paths:
      - .github/workflows/one-shot-format-motif.yml
      - src/szl_brand/motif.py

permissions:
  contents: write

concurrency:
  group: one-shot-motif-formatter
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: feat/class-motif-compiler-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply pinned formatter and push exact diff
        env:
          BRANCH: feat/class-motif-compiler-v1
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "ruff==0.16.6"
          ruff format src/szl_brand/motif.py
          ruff check src tests hatch_build.py
          ruff format --check src tests hatch_build.py
          if git diff --quiet -- src/szl_brand/motif.py; then
            echo "motif.py already formatter-stable"
            exit 0
          fi
          git config user.name "szl-frontier-bot"
          git config user.email "stephenlutar2+frontier@gmail.com"
          git add src/szl_brand/motif.py
          git commit -m "style(brand): apply pinned Ruff formatting" -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin "HEAD:${BRANCH}"
