name: Format motif once

on:
  push:
    branches:
      - feat/class-motif-compiler-v1
    paths:
      - .github/workflows/format-motif-once.yml

permissions:
  contents: write

concurrency:
  group: format-motif-once
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/class-motif-compiler-v1
          token: ${{ secrets.SZL_GITHUB_TOKEN || secrets.GH_PAT || github.token }}
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Format, remove this one-shot workflow, and commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "ruff==0.16.6"
          ruff format src/szl_brand/motif.py
          ruff check src/szl_brand/motif.py
          rm .github/workflows/format-motif-once.yml
          git diff --check
          if git diff --quiet; then
            echo "No formatting change required."
            exit 0
          fi
          git config user.name "szl-frontier-bot"
          git config user.email "stephenlutar2+frontier@gmail.com"
          git add src/szl_brand/motif.py .github/workflows/format-motif-once.yml
          git commit -m "style(brand): apply pinned Ruff formatting" -m "Signed-off-by: Stephen P. Lutar Jr. <stephenlutar2@gmail.com>"
          git push origin HEAD:feat/class-motif-compiler-v1
