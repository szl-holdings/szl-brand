name: Fuzz

on:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 6am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (Hypothesis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install project, pytest and Hypothesis
        run: python -m pip install --disable-pip-version-check -e ".[dev]" hypothesis pytest
      # Real failures keep their pytest exit code. Only exit 5 (no property
      # tests collected) is reported as NOT_RUN, and NOT_RUN is red too.
      - name: Run Hypothesis property tests
        run: python tools/fuzz_gate.py -m hypothesis --hypothesis-seed=0 -x tests
