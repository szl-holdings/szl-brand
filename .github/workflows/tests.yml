name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Test SDK and design-system contracts
        run: python -m pytest tests -q
      - name: Lint and format gate
        run: |
          ruff check src tests hatch_build.py
          ruff format --check src tests hatch_build.py
      - name: Build and verify revision-bound wheel export
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv wheel-test-venv
          wheel-test-venv/bin/python -m pip install --no-deps dist/szl_brand-*.whl
          revision="$(git rev-parse HEAD)"
          consumer="$(mktemp -d)"
          (
            cd "$consumer"
            "$GITHUB_WORKSPACE/wheel-test-venv/bin/python" -m szl_brand export-system \
              --source-revision "$revision" \
              --output ./kanchay
            "$GITHUB_WORKSPACE/wheel-test-venv/bin/python" -c \
              'from pathlib import Path; from szl_brand.system import verify_system; assert verify_system(Path("kanchay")) == []'
          )

  marketing-factory:
    name: Qualify marketing factory frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the pinned Space runtime and qualification tools
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev,space]"
          npm install --prefix "$RUNNER_TEMP/factory-browser" --ignore-scripts --save-exact playwright@1.62.0
          node "$RUNNER_TEMP/factory-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Qualify presentation, native projection and preserved source
        run: |
          python -m pytest tests/test_marketing_native.py -q
          ruff check marketing/space/szl-marketing-1.1/app.py marketing/space/szl-marketing-1.1/native_presentation.py tools/marketing_factory_fixture.py
          ruff format --check marketing/space/szl-marketing-1.1/app.py marketing/space/szl-marketing-1.1/native_presentation.py tools/marketing_factory_fixture.py
      - name: Exercise the actual staged Gradio app with local synthetic facts
        run: |
          node tools/verify_marketing_factory.mjs \
            --out "$RUNNER_TEMP/factory-observations" \
            --module "$RUNNER_TEMP/factory-browser/node_modules/playwright/index.mjs"
      - name: Retain unsigned local frontend observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketing-factory-frontend-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/factory-observations/factory-native-*/results.json
            ${{ runner.temp }}/factory-observations/factory-native-*/fixture.log
            ${{ runner.temp }}/factory-observations/factory-native-*/*.png
          retention-days: 14
          if-no-files-found: warn
