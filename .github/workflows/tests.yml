name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Test SDK and design-system contracts
        run: python -m pytest tests -q
      - name: Lint and format gate
        run: |
          ruff check src tests hatch_build.py
          ruff format --check src tests hatch_build.py
      - name: Build and verify revision-bound wheel export
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv wheel-test-venv
          wheel-test-venv/bin/python -m pip install --no-deps dist/szl_brand-*.whl
          revision="$(git rev-parse HEAD)"
          consumer="$(mktemp -d)"
          (
            cd "$consumer"
            "$GITHUB_WORKSPACE/wheel-test-venv/bin/python" -m szl_brand export-system \
              --source-revision "$revision" \
              --output ./kanchay
            "$GITHUB_WORKSPACE/wheel-test-venv/bin/python" -c \
              'from pathlib import Path; from szl_brand.system import verify_system; assert verify_system(Path("kanchay")) == []'
          )
