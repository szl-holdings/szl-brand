<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="avatar-title avatar-desc">
  <title id="avatar-title">Founder profile mark</title>
  <desc id="avatar-desc">High-resolution KANCHAY mark designed to remain legible at small avatar sizes.</desc>
  <defs>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9EEF6"/><stop offset="0.52" stop-color="#9AA7BD"/><stop offset="1" stop-color="#5C6B86"/></linearGradient>
    <radialGradient id="node" cx="38%" cy="34%" r="75%"><stop offset="0" stop-color="#F4B0A2"/><stop offset="0.55" stop-color="#DF735F"/><stop offset="1" stop-color="#C4543F"/></radialGradient>
    <radialGradient id="field" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#0D2540"/><stop offset="1" stop-color="#030F29"/></radialGradient>
    <filter id="avatar-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1024" height="1024" rx="196" fill="url(#field)"/>
  <rect x="18" y="18" width="988" height="988" rx="180" fill="none" stroke="#9AA7BD" stroke-opacity="0.18" stroke-width="4"/>
  <g transform="rotate(-23 512 470)"><ellipse cx="512" cy="470" rx="370" ry="214" fill="none" stroke="url(#orbit)" stroke-width="15" opacity="0.95"/></g>
  <circle cx="824" cy="245" r="31" fill="url(#node)" filter="url(#avatar-glow)"/>
  <path d="M470 334 C432 292 292 300 282 370 C273 435 397 444 421 485 C450 535 388 589 295 574" fill="none" stroke="#F4F6F8" stroke-width="74" stroke-linecap="round"/><path d="M548 306 H638 V554 H823 L750 642 H548Z" fill="#F4F6F8"/>
  <path d="M512 750 L558 858 H534 L512 793 L490 858 H466Z" fill="url(#orbit)" opacity="0.96"/>
  <circle cx="512" cy="470" r="294" fill="none" stroke="#E9EEF6" stroke-opacity="0.08" stroke-width="3"/>
</svg>
