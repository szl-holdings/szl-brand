<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="avatar-title avatar-desc">
  <title id="avatar-title">SZL Holdings organization mark</title>
  <desc id="avatar-desc">High-resolution KANCHAY mark designed to remain legible at small avatar sizes.</desc>
  <defs>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9EEF6"/><stop offset="0.52" stop-color="#A9C5FF"/><stop offset="1" stop-color="#5C6B86"/></linearGradient>
    <radialGradient id="node" cx="38%" cy="34%" r="75%"><stop offset="0" stop-color="#F4B0A2"/><stop offset="0.55" stop-color="#D7B55E"/><stop offset="1" stop-color="#C4543F"/></radialGradient>
    <radialGradient id="field" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#0D2540"/><stop offset="1" stop-color="#030F29"/></radialGradient>
    <filter id="avatar-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1024" height="1024" rx="196" fill="url(#field)"/>
