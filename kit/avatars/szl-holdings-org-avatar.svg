  <path d="M402 332 C365 291 238 299 229 367 C220 430 342 438 365 476 C395 525 338 574 251 561" fill="none" stroke="#F4F6F8" stroke-width="72" stroke-linecap="round"/><path d="M420 303 H642 V378 L532 516 H642 V594 H420 V520 L531 381 H420Z" fill="#F4F6F8"/><path d="M677 303 H754 V516 H881 L816 594 H677Z" fill="#F4F6F8"/>
  <path d="M512 750 L558 858 H534 L512 793 L490 858 H466Z" fill="url(#orbit)" opacity="0.96"/>
  <circle cx="512" cy="470" r="294" fill="none" stroke="#47D7C4" stroke-opacity="0.08" stroke-width="3"/>
